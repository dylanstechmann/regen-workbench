name: Local research tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests -v
  rdkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install rdkit==2026.3.6 jsonschema==4.25.1 PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests -v
  provenance-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.3
      - run: python -B -m unittest discover -s tests -p 'test_*manifest.py' -v
      - run: python -B -m unittest discover -s tests -p test_simulation_toolchain.py -v
