# Capability map: plugin-like features vs how this workbench implements them.
# Agents should read this file before inventing a new pipeline.

hardware:
  assumed_ram_gb: 64
  assumed_vram_gb: 16
  notes: >
    Comfortable: monomers / small complexes, ESM embeddings, NGS QC +
    modest single-cell, RDKit screens of 10k-100k compounds, Vina on
    one pocket. Tight: Boltz-2 large multimers, full AF2 DBs, RFdiffusion
    campaigns, DFT.

capabilities:
  literature:
    local: [regen pubmed, regen openalex, regen europepmc]
    accounts_optional: [NCBI_API_KEY for higher rate limits]
  protein_metadata:
    local: [regen uniprot, regen interpro]
  structures:
    fetch: [regen afdb, regen pdb]
    predict_local: [esmfold via fair-esm, boltz if installed, colabfold sibling image, OpenFold3 preview optional profile]
    predict_overflow: [Tamarind, Colab paid GPU, Vertex]
    visualize: [pymol -cq, py3Dmol in Jupyter]
  sequences:
    align_local: [mafft, muscle, clustalo]
    search_local: [blast, mmseqs2, hmmer]
    search_remote: [NCBI BLAST URL API — not wired into regen; run BLAST locally instead]
  interactions_pathways:
    remote: [regen string; Reactome REST from notebooks when needed]
  chemistry:
    local: [rdkit, regen compound-screen, openbabel, vina, gnina after explicit install]
    remote: [regen chembl, regen pubchem]
  docking:
    small_molecule_local_ready: [AutoDock Vina via regen dock-vina, GNINA via regen dock-gnina after explicit cache install, control-aware validation via regen docking-benchmark]
    small_molecule_not_installed: [UCSF DOCK, rDock, LeDock, DiffDock]
    small_molecule_hosted_manual: [SwissDock]
    small_molecule_license_gated: [GOLD, Schrödinger Glide, MOE, Discovery Studio, FlexX]
    protein_peptide_hosted_manual: [HADDOCK, ClusPro, ZDOCK]
    protein_peptide_not_installed: [RosettaDock]
    interpretation: >
      OpenFold3 and Boltz predict complex structures; they are not docking
      engines. Vina poses/scores and GNINA CNNscore/CNNaffinity are hypotheses,
      not measured binding, affinity, efficacy, safety, or anti-aging benefit.
      The validation report computes ROC AUC and enrichment on explicitly labelled
      active/inactive controls, and optional symmetry-aware redocking RMSD on SDF
      pose/reference pairs. It does not include decoys in primary metrics.
      Hosted tools are not called automatically and may require uploading
      structures/sequences.
  expression_exploration:
    local: [regen expression-contrast]
    notes: Linear normalized input only; effect sizes and leave-one-out sensitivity, no significance testing.
  ngs:
    local: [fastqc, multiqc, samtools, minimap2, seqkit, scanpy]
    pipelines: [nextflow locally; start Docker-based nf-core containers from the host]
  genomics_annotation:
    remote: [regen ensembl; ClinVar, gnomAD via their REST APIs from notebooks]

fold_routing:
  designed_or_orphan_monomer: esmfold
  natural_protein_with_homologs: colabfold_msa_server
  protein_ligand_complex_prediction: openfold3_preview_or_boltz_if_fits_16gb_else_tamarind
  known_small_molecule_binding_site: vina_and_optional_gnina_on_prepared_inputs
  experimental_structure_exists: fetch_pdb_first
  already_in_afdb: fetch_afdb_first

mcp:
  server: tools/regen_mcp.py
  transport: stdio
  exposed_tools:
    - regen_pubmed
    - regen_openalex
    - regen_europepmc
    - regen_uniprot
    - regen_interpro
    - regen_ensembl
    - regen_afdb
    - regen_pdb
    - regen_string
    - regen_chembl
    - regen_pubchem
    - regen_msa
    - regen_rdkit
    - regen_dock_vina
    - regen_dock_gnina
    - regen_docking_benchmark
    - regen_compound_screen
    - regen_expression_contrast
    - regen_pymol_png
    - regen_fold_route
    - regen_doctor
  resources:
    - uri: regen://config/tools.yaml
      description: This capability map (read-only)
    - uri: regen://data/provenance
      description: Listing of provenance receipt files; append filename to read individual receipts
  security:
    arbitrary_shell: false
    docker_socket_mount: false
    host_credential_mounts: false
    output_limit_chars: 60000

http_resilience:
  retry_count: 3
  backoff: exponential
  backoff_base_seconds: 1
  retryable_codes: [429, 500, 502, 503, 504]
  notes: >
    All regen CLI HTTP calls retry on transient server errors and
    connection failures with exponential backoff (1s, 2s, 4s).
    Client errors (404, 400) are raised immediately.
