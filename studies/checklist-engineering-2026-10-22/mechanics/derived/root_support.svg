<text x="25" y="30" font-size="20">Spatial root support and crown contact: illustrative linear model</text>
<text x="25" y="53" font-size="13">Rigid crown/root; unit-response coefficients, no human calibration or acceptance threshold</text>
<text x="25" y="90" font-size="16">A. Equal removed length, different compliance</text>
<text x="25" y="142" font-size="13">Uniform</text>
<rect x="155" y="125" width="55.000" height="26" fill="#184e77"/>
<text x="218.000" y="143" font-size="13">1.000x</text>
<text x="25" y="204" font-size="13">Cervical loss</text>
<rect x="155" y="187" width="179.334" height="26" fill="#b34d24"/>
<text x="342.334" y="205" font-size="13">3.261x</text>
<text x="25" y="266" font-size="13">Apical-side loss</text>
<rect x="155" y="249" width="83.666" height="26" fill="#387d3b"/>
<text x="246.666" y="267" font-size="13">1.521x</text>
<text x="25" y="328" font-size="13">One-side loss</text>
<rect x="155" y="311" width="93.318" height="26" fill="#7652a3"/>
<text x="256.318" y="329" font-size="13">1.697x</text>
<text x="155" y="397" font-size="13">Crown directional compliance / uniform reference</text>
<text x="25" y="432" font-size="12">Each loss removes 0.60 of 2.30 boundary-length units.</text>
<text x="25" y="451" font-size="12">Base retained; changes are hypothetical support states.</text>
<text x="585" y="90" font-size="16">B. Same whole matrix, different local reactions</text>
